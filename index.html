<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse open roles by department." />
  <title>Role Explorer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#role-results">Skip to roles</a>

  <header class="page-header container">
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light theme">☀ Light</button>
    <p class="eyebrow">Careers</p>
    <h1 class="page-title">Role Explorer</h1>
    <p class="page-subtitle">Find a role that fits you. Filter open positions by department.</p>
  </header>

  <main class="container">
    <nav aria-label="Department filters">
      <ul class="filter-list" id="filter-list"></ul>
    </nav>

    <p class="results-summary" id="results-summary" aria-live="polite" aria-atomic="true"></p>

    <section id="role-results" class="results" aria-label="Job roles" tabindex="-1">
      <ul class="role-grid" id="role-grid"></ul>

      <div class="empty-state" id="empty-state" hidden>
        <i class="fa-solid fa-briefcase empty-state__icon" aria-hidden="true"></i>
        <h2 class="empty-state__title" id="empty-state-title">No open roles here yet</h2>
        <p class="empty-state__text">We're not hiring in this department right now. Check back soon, or explore other teams.</p>
        <button type="button" class="btn" id="empty-state-reset">View all roles</button>
      </div>
    </section>
  </main>

  <footer class="page-footer">
    <div class="container footer-inner">
      <p class="footer-title">Careers</p>
      <p class="footer-tagline">Grow with a team that builds for learners.</p>
    </div>
  </footer>
</body>
</html>
